name: Deploy Dev

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or branch with a successful CI run
        required: true
        default: dev

permissions:
  actions: read
  contents: read

concurrency:
  group: dinotty-dev-deploy
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve CI-verified revision
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Resolve and verify revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          AUTOMATIC_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_REF: ${{ inputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            sha="$AUTOMATIC_SHA"
          else
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${MANUAL_REF}" --jq .sha)"
          fi
          test -n "$sha"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${sha}&status=completed&per_page=100" \
            | jq -e '
                [.workflow_runs[]
                  | select(.name == "CI" and .conclusion == "success")]
                | length > 0
              ' >/dev/null
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build deployment bundle
    needs: resolve
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build static server binary
        env:
          REVISION: ${{ needs.resolve.outputs.sha }}
        run: |
          short_revision="${REVISION:0:12}"
          export DINOTTY_BUILD_VERSION="0.19.0+redyuan.${short_revision}"
          cargo build --release --target x86_64-unknown-linux-musl --package dinotty-server

      - name: Assemble deployment bundle
        env:
          REVISION: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p release/.deploy-artifacts release/deploy/docker
          cp deploy/docker/.dockerignore release/.dockerignore
          cp deploy/docker/docker-compose.yml release/deploy/docker/
          cp deploy/docker/docker-compose.production.yml release/deploy/docker/
          cp deploy/docker/Dockerfile.binary release/deploy/docker/
          cp deploy/docker/promote-release.sh release/deploy/docker/
          cp target/x86_64-unknown-linux-musl/release/dinotty-server \
            release/.deploy-artifacts/dinotty-server
          cp deploy/docker/entrypoint.sh release/.deploy-artifacts/entrypoint.sh
          short_revision="${REVISION:0:12}"
          printf '%s\n' "$REVISION" > release/REVISION
          printf '0.19.0+redyuan.%s\n' "$short_revision" > release/BUILD_VERSION
          chmod 755 release/deploy/docker/promote-release.sh
          tar -C release -czf dinotty-deploy.tgz .

      - uses: actions/upload-artifact@v4
        id: upload-artifact
        with:
          name: dinotty-dev-deploy-${{ needs.resolve.outputs.sha }}
          path: dinotty-deploy.tgz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to yuanspaces-nexus
    needs: [resolve, build]
    runs-on: [self-hosted, linux, x64, dinotty-prod]
    steps:
      - name: Download deployment bundle through the private proxy
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          GITHUB_TOKEN: ${{ github.token }}
          HTTPS_PROXY: socks5h://127.0.0.1:17890
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dinotty-deploy
          mkdir -p /tmp/dinotty-deploy
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 \
            --proxy "$HTTPS_PROXY" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/dinotty-deploy/artifact.zip
          unzip -q /tmp/dinotty-deploy/artifact.zip -d /tmp/dinotty-deploy
          test -f /tmp/dinotty-deploy/dinotty-deploy.tgz

      - name: Install and verify deployment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dinotty-deploy/release
          mkdir -p /tmp/dinotty-deploy/release
          tar -C /tmp/dinotty-deploy/release \
            -xzf /tmp/dinotty-deploy/dinotty-deploy.tgz
          /tmp/dinotty-deploy/release/deploy/docker/promote-release.sh \
            /tmp/dinotty-deploy/release
